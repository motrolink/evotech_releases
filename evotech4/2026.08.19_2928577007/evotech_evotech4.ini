	clFuelCommon_minClt = "Minimum coolant temperature for closed loop fuel correction (short-term and long-term). Below this temperature, fuel corrections are suspended to avoid instability during warm-up, when the lambda sensor may not yet be at operating temperature."
	clFuelCommon_minLambda = "Below this lambda value fuel corrections are paused. Prevents the ECU from correcting during intentionally rich conditions such as acceleration enrichment or cold start. Typical value is 0.82 which corresponds to a moderately rich mixture."
