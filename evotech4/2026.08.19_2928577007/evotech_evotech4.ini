[EventTriggers]
  triggeredPageRefresh = 1, { triggerPageRefreshFlag }
  ; LTFT trims live on page 1 now (persistentConfiguration), not their own
  ; page - see docs/design/unified-learned-data-config.md. This used to say
  ; "3" (the old TS_PAGE_LTFT_TRIMS), which pointed at a page that no longer
  ; exists once that page was removed - TunerStudio would try to refresh a
  ; nonexistent page every time LTFT learned something new (this flag pulses
  ; ~1/sec during active learning), which is exactly the kind of thing that
  ; can make live reads look stuck/null while tuning.
  triggeredPageRefresh = 1, { ltftPageRefreshFlag }
