	coldStartAuxDurationTable = "How long to hold the valve open in a single fixed pulse at the start of cranking, by ethanol content and coolant temperature.\nZero means this blend/temperature combination doesn't need help. Calibrate from a real cold-start test matrix or the vehicle's factory spec -- ethanol-gasoline vapor pressure does not blend linearly with ethanol content, so don't assume a straight line between two entries here."
	coldStartAuxMaxTimeout = "Safety ceiling on the priming pulse duration, regardless of what the map above returns.\nProtects against flooding/cylinder washdown if the map is misconfigured with an excessive value."
	tcEnabled = "Enable Traction Control wheel slip detection.\nDetection only in this version -- no ignition/ETB/spark-cut actuation is applied."
	tcMode = "Wheel slip detection method.\nTraction Wheel: engine RPM acceleration only, no wheel speed sensor needed, works from a standing start (below 1 km/h it stays inactive -- see feature doc).\nDual Sensor: needs two wheel speed inputs (traction + drag wheel), most accurate."
