	tpsAccelLookback = "Decay time for acceleration enrichment after a small tip-in (TPS barely moves). Does not affect detection, only how long the extra fuel lingers after the transient ends -- it fully tapers off over about 5x this value. Larger tip-ins scale toward the Accel - Full Tip-in setting below instead."
	tpsDecelEnleanmentThreshold = "Unused -- superseded by the shared TPS/TPS accel table (see tpsTpsAccelTable) which now also drives decel enleanment with a sign flip. Kept only for config-layout/burn compatibility with older tunes."
	tpsDecelEnleanmentMultiplier = "Unused -- superseded by the shared TPS/TPS accel table (see tpsTpsAccelTable) which now also drives decel enleanment with a sign flip. Kept only for config-layout/burn compatibility with older tunes."
	accelEnrichmentMode = "Selects how extra fuel is delivered during acceleration.\nPulso Fixo adds a fixed duration pulse in milliseconds to each injection regardless of base fuel. Easy to tune and predictable across all operating conditions.\nProporcional adds a percentage of the current base fuel delivery. The amount scales automatically with load and RPM which produces more consistent results but requires the base fuel map to already be well calibrated."
	tpsDecelLookback = "Decay time for deceleration enleanment after a small throttle lift (TPS barely moves). Does not affect detection, only how long the correction lingers after the transient ends -- it fully tapers off over about 5x this value. Larger lifts scale toward the Decel - Full Lift setting below instead."
	tpsAccelThreshold = "Fast-EMA minus slow-EMA divergence (in TPS %) required to keep an acceleration transient active. Also gates when the transient is considered over."
	tpsDecelThreshold = "Slow-EMA minus fast-EMA divergence (in TPS %) required to keep a deceleration transient active. Also gates when the transient is considered over."
	tpsAccelFastAlpha = "Fast EMA alpha for TPS filtering (weight of the current sample). Higher = more responsive, more sensitive to sensor noise."
