	disableFan2WhenStopped = "Inhibit operation of this fan while the engine is not running."
	coldStartAuxEnable = "Enable the auxiliary cold-start valve/injector.\nRequires a dedicated pure-gasoline reservoir and injector/valve wired to the configured output -- this is NOT one of the main injectors."
