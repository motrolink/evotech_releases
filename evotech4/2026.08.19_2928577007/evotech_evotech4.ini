	injector_battLagCorrTable = "ms delay between injector open and close dead times"
	injectorSecondary_flow = "This is your injector flow at the fuel pressure used in the vehicle\nSee units setting below"
	injectorSecondary_battLagCorrPressBins = "Injector correction pressure"
	injectorSecondary_battLagCorrTable = "ms delay between injector open and close dead times"
