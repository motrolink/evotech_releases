	stft_tauBase = "Base closed loop correction time constant - the fastest the short-term trim will ever correct, even under the most favorable exhaust flow. The ECU automatically slows down below this floor at low RPM/load, where exhaust gas transport delay makes fast correction unsafe, so no separate settings per RPM/load region are needed. Typical starting point: 1-5s. If corrections feel unstable or hunt, increase this value."
