	help = tractionControlHelp, "Traction Control"
		text = "Traction Control estimates rear-wheel slip and reduces torque via ignition retard and spark cut when it detects wheelspin. It has 2 detection modes, selected by Detection mode. Traction Wheel (1 Sensor) needs the VSS plus engine RPM: it watches how fast RPM accelerates (dRPM/dt) and compares it against a per-gear limit (below, in Traction Wheel (1 Sensor)), but the VSS itself only gates whether TC is active -- below 1 km/h it stays fully inactive, since dRPM/dt alone can't tell a real launch from a free rev in neutral. Dual Sensor compares two wheel speed inputs directly (traction wheel vs. a free-rolling/drag wheel) -- the most accurate mode, but it needs Aux Speed Input 1 and either Aux Speed Input 2 or the VSS wired and configured under Sensors -> Extra Speed Sensors."
		text = "Enable arms the module; TC stays fully inert with default curves even when enabled (see below). Minimum PPS/TPS to arm and Minimum MAP to arm are throttle/load gates -- TC only evaluates slip above these, so light-throttle driving never triggers a cut. Clutch settle time re-arms TC a set time after the clutch pedal comes back up, so the driveline shock of re-engaging the clutch itself isn't misread as wheelspin; this uses whichever clutch switch is wired (up, down, or both -- either one reading 'pressed' counts). Filter time constant smooths the Traction Wheel dRPM/dt signal -- higher values react slower but reject more noise."
		text = "Once slip is detected, the Ignition Retard and Spark Cut curves (Actuation tab) convert the estimated slip %% into a torque reduction, each on its own ramp rate so the correction comes in and out smoothly instead of stepping. Both curves start zeroed -- TC computes and reports slip even with a fresh configuration, but does not touch ignition or fuel until you shape at least one curve. TC's corrections stack with Launch Control and Flat Shift instead of overriding them, since wheelspin can happen at the same instant as a launch or a shift."

	help = launchControlHelp, "Launch Control"
		text = "Launch Control (also known as Rolling Anti-Lag) holds the engine at a set RPM to build boost before a standing start. Enable it and select the activation mode: a dedicated button, clutch switch, or speed-based automatic trigger."
		text = "Set the Launch RPM target and the RPM Window. The ECU begins applying corrections below Launch RPM and ramps them out over the window. Speed Threshold prevents accidental activation above a set speed. TPS Threshold requires the throttle to be open before activation."
		text = "Ignition Retard adds heat to the exhaust to spool the turbo. Smooth Retard mode interpolates the retard from zero to full over the RPM window instead of applying it abruptly. Hard Cut adds ignition and fuel cuts for a more aggressive launch. Corrections End RPM defines where all cuts are fully removed."

	help = antiLagHelp, "Anti-Lag"
		text = "Anti-Lag (also known as Rotational Idle) keeps the turbo spooled during throttle lifts by retarding ignition and adding fuel, generating heat and exhaust pressure without requiring the throttle to be open."
		text = "Set the Activation Mode to Switch Input for a dedicated button, or leave it without a switch for automatic activation. The RPM and CLT ranges define when the system is allowed to operate. Max TPS prevents activation while the driver is on the throttle. Timeout limits how long the system can run continuously."
		text = "The Fuel and Ignition adjustment tables shape the engine response during Anti-Lag. Air additions via Idle Air Add and ETB Air Add help maintain boost pressure through the intake."

	help = boostBlendHelp, "Boost Blend Tables"
		text = "Blend tables add a variable correction to the boost open or closed loop output based on a chosen engine parameter."
		text = "The bias curve controls how much of the blend table is applied. A bias value of 50 with a blend table value of +10 results in +5.0 added to the boost output. Select the blend parameter to define the X axis of the bias curve. The Y axis override allows a custom load axis independent of the main boost table axis."
		text = "Use blend tables to compensate for conditions not captured by the main table, such as air temperature variation, gear position, or vehicle speed."

	help = boostPidHelp, "Boost Control PID"
        text = "P = % per kPa error<br>"
        text = "I = % per kPa-seconds<br>"
        text = "D = % per kPa/sec<br>"
        text = "<br>"
        text = "If the boost error is 5kpa, and your P is set to 2, it will make a correction of 10%.<br>"
        text = "If the boost error has been 5kPa for 2 second (10 kPa-seconds) and I is set to 0.1, it will make a correction of 1%<br>"
        text = "If the boost is changing at 10kPa/s and D is set to 0.5, it will make a correction of 5%.<br>"
        text = "Those three terms are then added together, and limited by the PID min/max settings.<br>"
        text = "<br>"
        text = "That is then added to the value from the open loop table, and sent to PWM the valve.<br>"

	help = veTableDialogHelp, "Volumetric Efficiency"
		text = "Volumetric Efficiency is used to calculate fuel in Speed Density mode. VE incorporates pressure ratio as measured by MAP sensor in boost (no VE ever above 105%ish)"
		webHelp = "https://motrolink.com"

	help = stepperHbridgeHardwareHelp, "Stepper driven by Dual H-bridge"
		text = "In case you are using two H-bridges driving 4-wire stepper. H-brigde control signals connected to MCU pins configured here."

	help = idleStepperHwHelp, "Stepper drivern by step motor driver IC"
		text = "In case you have some special IC that drives your stepper. MCU to IC control signals (DIR/STEP/EN) configured here"

	help = stepperDirectDriveHardwareHelp, "Stepper driven by 4 Push-Pull/Pull outputs"
		text = "In case you have 4/6-wire stepper driven by 4 ECU outputs in Push-Pull or Pull mode. Set ECU outputs used for each phase here."

	help = lambdaBlendHelp, "Lambda Blend Tables"
		text = "Lambda Blend tables apply a conditional adder to the target lambda map based on a configurable parameter such as gear position, ethanol content, or any analog input."
		text = "Each blend has two components: a bias curve and an adder table. The bias curve (indexed by the blend parameter) controls how much of the correction is applied — 0 means no effect, 100 means full effect. The adder table contains the correction values as a direct offset to the target lambda."
		text = "Example: an adder of +0.05 with a bias of 50 results in +0.025 added to the target lambda at that point."

	help = veBlendHelp, "VE Blend Tables"
		text = "VE Blend tables apply a conditional correction to the VE map based on a configurable parameter such as gear position, ethanol content, boost level, or any analog input. Up to four independent blends can be active simultaneously."
		text = "Each blend has two components: a bias curve and a blend table. The bias curve (indexed by the blend parameter) controls how much of the correction is applied — 0 means no effect, 100 means full effect. The blend table contains the correction values in percent relative to VE."
		text = "Example: a blend table value of +10 with a current bias of 50 adds +5 to the VE at that point. The Y axis follows the main VE load axis by default. Use Y axis override to change this."

	help = multisparkHelp, "Multispark"
		text = "Multispark fires multiple ignition events per engine cycle to improve combustion at low RPM and light load, increasing the chance of igniting lean or diluted mixtures."
		text = "Each additional spark consumes coil energy. Coils with insufficient recharge time may overheat. Not recommended for single-coil (distributor) or wasted spark ignition systems."
		text = "The maximum sparking angle and extra spark count limit how aggressively multispark operates. Lower values are safer; higher values may improve idle quality on individual-coil setups."

	help = ignitionOutputHelp, "Ignition Outputs"
		text = "Assign each ignition output to the physical pin connected to that cylinder's coil. In sequential mode all outputs are active and each fires once per engine cycle."
		text = "In wasted spark mode only the first half of outputs are active. Each output fires two cylinders simultaneously — one on the compression stroke and one on the exhaust stroke."
		text = "Connect each output to the coil of the matching cylinder number. The ECU manages the firing order automatically."

	help = ignitionBlendHelp, "Timing Blend Tables"
		text = "Timing Blend tables apply a conditional adder to the base ignition timing map based on a configurable parameter such as gear position, ethanol content, boost level, or any analog input. Up to four independent blends can be active simultaneously."
		text = "Each blend has two components: a bias curve and an adder table. The bias curve (indexed by the blend parameter) controls how much of the correction is applied — 0 means no effect, 100 means full effect. The adder table contains the correction values in degrees of ignition timing advance."
		text = "Example: an adder table value of +10 with a current bias of 50 adds +5 degrees to the base ignition timing at that point. The Y axis follows the main ignition load axis by default. Use Y axis override to change this."

  help = blendUniversalHelp, "Blend"
    text = "Blend is advanced versions of dual map<br><br>"
    text = "Blend factor of 0% means that values from base table are used<br>"
    text = "Blend factor of 100% means that values from secondary blend table are used<br>"
    text = "Blend factor of 50% means that values from average values between primary and secondary able are used<br>"

	help = iatFuelCorrCurveHelp, "IAT Fuel Correction"
		text = "A simple multiplier curve that scales fuel delivery based on intake air temperature (IAT). Hotter air is less dense, so less fuel is needed; colder air is denser, so more fuel is needed. A value of 1.0 means no correction. For most setups, Charge Temperature Estimation is a more accurate alternative — it blends IAT with coolant temperature to better represent the actual charge entering the cylinder. Use this curve only if charge temperature estimation is disabled or unavailable."

  help = baroCorrectionHelp, "Baro Correction"
    text = "MAP already adjusts fueling for altitude on the intake side."
    text = "baro table is an extra tweak for the exhaust side: lower barometric pressure usually means lower exhaust backpressure, which improves scavenging so the engine breathes a bit better than MAP alone predicts. That non-linear effect needs its own correction."

	help = injectorOutputHelp, "Injector Outputs"
		text = "Assign each injection output to the physical pin connected to that cylinder's injector. In sequential mode all outputs are active and each fires once per cycle. In semi-sequential mode only the first half of outputs are active and each output drives two cylinders."
		text = "Connect each output to the injector of the matching cylinder number. The ECU manages the firing order automatically."

	help = stagedInjectionHelp, "Staged Injection"
		text = "Staged injection uses a second set of injectors (secondary injectors) that activate progressively as engine demand increases. It is commonly used when primary injectors are too large for idle stability or too small to deliver sufficient fuel at peak power."
		text = "The % table controls how much of the total fuel delivery is handled by the secondary injectors at each operating point. A value of 0 means only primary injectors are active — 100 means only secondary. Dead time and flow rate must be configured separately for the secondary injectors."

	help = tpsTpsAdditionHelp, "Fuel Addition Table"
		text = "Pulso Fixo: adds a fixed fuel pulse in milliseconds to each injection event. The table value is the added time in ms regardless of current load or RPM. Easy to calibrate and produces predictable results across all operating conditions."
		text = "Proporcional: adds a percentage of the current base injection pulse. The correction scales automatically with load and RPM so the enrichment stays proportional at any operating point. This mode requires a well-calibrated base VE map to work correctly."
		text = "The table axes are TPS Before (X) and TPS After (Y) — both in percent. X is the throttle position at the start of the movement and Y is the position at the end. A cell at X=10 Y=60 fires when the throttle moves from around 10% to around 60%. Cells with higher Y than X represent tip-ins — cells with lower Y represent tip-outs. Set tip-out cells to zero to avoid over-leaning on deceleration."
		text = "Typical values: in Pulso Fixo mode the table rarely exceeds 10ms for most engines — values up to 100ms are valid but uncommon. In Proporcional mode values are normally below 1. The ECU automatically applies the table value as a fuel reduction when the movement is a tip-out, so a single map handles both enrichment on tip-in and enleanment on tip-out."

	help = accelEnrichmentHelp, "Quick Injection"
		text = "TPS/TPS: adds extra fuel when the throttle opens fast. The Fuel Addition Table defines how much, indexed by throttle position before and after the tip-in."
		text = "Wall Wetting: part of the injected fuel sticks to the intake port walls as a film. During fast tip-ins this film absorbs fuel that should reach the cylinder, causing a lean spike. The model compensates using an impact fraction (beta) and an evaporation time constant (tau)."

	help = fuelHelp, "Injection Settings"
		text = "Configure injection mode, injector flow rate, stoichiometric ratio and load axis overrides."

	help = batteryInputHelp, "Battery and Ignition Inputs"
		text = "The battery voltage input reads the ECU supply voltage through a resistive voltage divider on the ADC pin. The default divider coefficient is 9.2 — the ECU multiplies the measured ADC voltage by this value to obtain the actual battery voltage. Adjust if your hardware uses a different resistor ratio or if the displayed voltage does not match a reference measurement."
		text = "The ignition key ADC input reads the voltage on the ignition switch line. It is used to detect key-on state or to monitor the switched supply voltage independently from the main battery rail. The default divider coefficient is 3 — adjust if your hardware uses a different ratio."

	help = alternatorHelp, "Alternator Control"
		text = "The alternator controller regulates battery voltage by varying the duty cycle of the PWM signal sent to the alternator field winding. When enabled, the ECU reads the battery voltage sensor and closes a PID loop to maintain the voltage at the target set in the Voltage Target Table."
		text = "Select the output pin and its mode, then set the PWM frequency — most alternators use 50 to 200 Hz. The A/C duty adder adds a fixed offset when the A/C compressor is active to compensate for the extra electrical load. Tune the PID with small gains: start with P around 0.1 and I around 0.01, and increase gradually while monitoring the voltage at idle and under load."
		text = "The Voltage Target Table sets the desired battery voltage as a function of RPM and engine load. A typical target is 14.0 to 14.4 V. Use lower targets in RPM/load regions where reducing alternator effort is desired, and higher targets where stronger charging is preferred."

	help = relayAndPumpHelp, "Relay and Fuel Pump"
		text = "The main relay controls the ECU-switched power rail that feeds injectors, coils, and most sensors. It must be energized for the engine to run. Configure the output pin and its logic mode (normal or inverted depending on whether the relay is driven high or low). The Test button activates the relay briefly to verify wiring."
		text = "The fuel pump relay or pump output activates when the ECU powers on, priming the fuel rail before cranking, and stays on during engine operation. The prime duration sets how long the pump runs before cranking if no RPM signal is detected — typically 2 to 4 seconds. The Test button activates the pump for diagnostics without starting the engine."

	help = starterHelp, "Starter"
		text = "Starter Control configures the start/stop button input and the starter relay output. The ECU can drive the starter relay while checking the configured cranking condition, such as requiring the brake or clutch pedal to be pressed before cranking. The maximum cranking duration limits how long the starter can stay engaged."

	help = instrumentOutputsHelp, "Instrument Outputs"
		text = "The tachometer output sends an RPM pulse signal to the instrument cluster or external tachometer. Set the output pin and select the pulse mode — duty cycle or fixed width. Pulse per revolution must match the gauge input specification: most tachometers expect one pulse per cylinder firing event, but some use two pulses per revolution regardless of cylinder count."
		text = "The speedometer output sends a vehicle speed pulse signal to the speedometer gauge. Set the pulses per kilometer to match the gauge calibration. This value depends on the final drive ratio, tyre rolling circumference, and the gauge input sensitivity."
		text = "The Check Engine output drives the malfunction indicator lamp (MIL) on the dashboard. Configure the output pin, logic mode, and the warning flash period. The Test button activates the lamp to verify the circuit. The MIL turns on automatically when any diagnostic fault is detected."

	help = cylinderBankHelp, "Cylinder Bank Assignment"
		text = "Assign each cylinder to its fuel correction bank. Group cylinders that share the same lambda sensor together. On a V-engine with two O2 sensors, assign one side to Bank A and the other to Bank B."

	help = tChargeHelp, "Charge Temperature Estimation"
		text = "The charge temperature is an estimate of the air temperature inside the cylinder at intake close. It is calculated as a weighted blend between the intake air temperature (IAT) and the coolant temperature (CLT). At cold start, the charge is dominated by CLT; at high RPM and wide-open throttle, it approaches IAT. Using this estimate instead of raw IAT improves fuel accuracy across all operating conditions — especially during warm-up and tip-in after a cold soak."

	help = idleTimingHelp, "Closed-loop Timing"
		text = "Closed-loop idle ignition timing corrects RPM error during idle by advancing or retarding spark timing. Unlike the IAC valve, timing responds almost instantly to RPM disturbances, making it effective for damping oscillations."
		text = "Gains are in degrees of ignition advance per RPM of error. A proportional gain of 0.10 means a 100 RPM error produces 10 degrees of correction. Start very low — values between 0.05 and 0.15 are typical. Avoid high gains as they can cause hunting."
		text = "Maximum Retard limits how far the controller can pull timing back when RPM is too high. Maximum Advance limits how far it can add timing when RPM is too low. Soft Entry Time is the ramp duration in seconds for the controller to reach full authority after entering idle — use this to avoid a jolt when transitioning from driving."

	help = idleSettingsHelp, "Idle Settings"
		text = "Idle Settings configures the idle speed controller. The Control Mode panel selects the strategy and defines the thresholds that determine when idle control is active — TPS threshold, RPM upper limit, RPM deadzone, and maximum vehicle speed."
		text = "The Adders panel adds a fixed valve position offset for A/C and cooling fans. These run in both open and closed loop modes and compensate for the extra load those devices place on the engine."
		text = "The Closed Loop PID panel is active only when the idle mode is set to Closed Loop or Modeled Flow. Proportional gain reacts immediately to RPM error, integral gain eliminates steady-state offset, and derivative gain dampens oscillation. Start with low gains and increase gradually. Min and Max Output limit the PID authority. PID Extra for Low RPM adds extra duty at very low speeds to prevent stall."

	help = idleFeaturesHelp, "Idle Features"
		text = "Idle Features configures one-time setup options that change how the idle controller behaves but are rarely adjusted after initial calibration."
		text = "Ramp target gradually reduces the RPM target from the entry threshold down to the idle setpoint when returning from driving, preventing the RPM from dropping too fast and causing a stall."
		text = "Separate ignition and VE tables allow the idle controller to use its own maps instead of the main ignition and fuel tables, enabling fine-tuning of combustion stability at idle without affecting the rest of the tune."
		text = "Separate coasting idle table enables an independent valve position table used during deceleration. Dashpot settings add a brief extra valve opening when the throttle closes suddenly, smoothing the transition to idle and preventing a stumble."

	help = crankingHelp, "Cranking Settings"
		text = "Cranking settings define how the ECU manages fuel and ignition from the first trigger event until the engine RPM rises above the cranking threshold and transitions to normal operation."
		text = "The Fuel panel selects the injection mode used during start and whether to use the dedicated cranking fuel tables or the running VE map. The Ignition panel sets the timing advance mode — Fixed holds a constant angle that transitions smoothly to the running timing as RPM increases, while Table uses a separate advance curve directly."
		text = "The Advanced panel provides additional options: flood clear cuts fuel injection when TPS is above 95 percent during cranking to clear flooded cylinders, faster spin-up fires the engine before a full trigger sync cycle for quicker starts, and the optional flex fuel table enables a second set of cranking fuel values for E100 blends."

	help = triggerHelp, "Trigger Settings"
		text = "Configure the trigger wheel type, tooth count, trigger angle offset and cam input signals."
		webHelp = "https://motrolink.com"

	help = etbHelp, "ETB Control"
		text = "ETB Control configures the electronic throttle actuator. The motor settings select whether ETB control is active, whether the actuator is disabled when the engine is stopped, the PWM frequency, and the allowed minimum and maximum throttle positions."
		text = "Sensor calibration learns the closed and open positions of each ETB TPS sensor. During auto calibration the ECU moves the throttle: it should open first, then close. If the movement is reversed, swap the ETB+/ETB- motor wires before calibrating again. Save to flash after calibration to keep the learned values."
		text = "PID Autotune estimates the throttle control gains. Run it only with ignition voltage present, the engine stopped, and the throttle plate free to move. Let it run for 10 to 15 seconds, then press Stop and verify that the throttle follows the target smoothly."

	help = tpsSensorHelp, "TPS Sensor"
		text = "TPS Sensor configures the throttle position sensors used to measure the actual throttle plate position. On a cable throttle engine without ETB, configure only Throttle Body #1 primary sensor. With the throttle fully closed, copy the displayed raw voltage into Closed Voltage. With the throttle fully open, copy the displayed raw voltage into Open Voltage."
		text = "Use secondary TPS inputs only when the throttle body has a redundant position sensor. Configure TPS2 only when the engine has a second throttle body or a second ETB. The primary and secondary sensors must move together and should report stable values across the full travel."
		text = "For ETB, the TPS sensors are part of the electronic throttle safety system. Configure the sensor inputs first, then use Auto Calibrate ETB so the ECU learns the closed and open positions. During calibration the throttle should open first and then close. If it moves in the wrong direction, swap the ETB motor wires before calibrating again."

	help = ppsSensorHelp, "Accelerator Pedal Sensor"
		text = "Accelerator Pedal Sensor configures the pedal position sensors used as the driver request for ETB. Engines with a cable throttle usually do not need this menu unless another feature explicitly uses pedal position."
		text = "Configure the primary pedal sensor input first. With the pedal released, copy the displayed raw voltage into Idle Voltage. With the pedal fully pressed, copy the displayed raw voltage into WOT Voltage. Use the secondary pedal sensor only when the pedal assembly has a redundant track."
		text = "For ETB, the pedal sensors are part of the safety checks. The primary and secondary tracks must move smoothly through the full pedal travel and must agree with each other. If the reported pedal position moves backward or the split is unstable, verify the wiring and sensor selection before enabling ETB control."

	help = mafHelp, "MAF Sensor"
		text = "MAF Sensor configures the analog input used to read the mass air flow sensor. Select the ADC input connected to the sensor signal and set the filter only as much as needed to remove noise without making the airflow signal slow."
		text = "After selecting the input, configure the MAF Curve. The curve converts sensor voltage to airflow in kg/hour, so the ECU cannot calculate load correctly from MAF until this curve matches the sensor calibration."
		text = "Use the sensor datasheet, a known transfer table, or measured airflow data to fill the curve. Verify that raw MAF voltage moves smoothly with airflow and that the airflow value increases as the throttle opens."

	help = cltSensorHelp, "CLT Sensor"
		text = "CLT Sensor configures the coolant temperature input. Select the ADC input connected to the sensor and set the pullup resistor value used by the ECU input circuit. The default pullup resistor is 2700 ohm."
		text = "For a thermistor, enter three temperature and resistance reference pairs from the sensor calibration data: a cold reference, a middle reference, and a hot reference. Use values spread across the operating range, for example around -40 C, 0 to 25 C, and 100 C, so the calculated curve matches the sensor over the full range."
		text = "If the sensor has a linear characteristic, enable Linear characteristic and enter scale points that represent the linear sensor response instead of a thermistor curve. After configuration, verify that raw voltage changes smoothly and the CLT gauge reads close to ambient temperature before starting the engine."

	help = iatSensorHelp, "IAT Sensor"
		text = "IAT Sensor configures the intake air temperature input. Select the ADC channel connected to the sensor and set the pullup resistor. Several common IAT sensor calibrations are available via the preset selector."
		text = "For a thermistor, enter three reference points from the sensor datasheet: a cold, middle, and hot value. After configuration, verify that the raw voltage changes and the IAT gauge reads close to ambient temperature at startup."

	help = auxTemp1SensorHelp, "Aux Temp 1 Sensor"
		text = "Aux Temp 1 is a general-purpose thermistor input for additional temperature monitoring such as gearbox oil, differential, or cylinder head temperature."
		text = "Configure the ADC channel, pullup resistor, and three calibration reference points from the sensor datasheet."

	help = auxTemp2SensorHelp, "Aux Temp 2 Sensor"
		text = "Aux Temp 2 is a second general-purpose thermistor input for additional temperature monitoring."
		text = "Configure the ADC channel, pullup resistor, and three calibration reference points from the sensor datasheet."

	help = oilTempSensorHelp, "Oil Temperature Sensor"
		text = "Configures the engine oil temperature sensor input. Select the ADC channel and set the pullup resistor value."
		text = "Enter three temperature and resistance reference pairs from the sensor calibration data. Oil temperature can be used as a blend table axis for protection strategies."

	help = fuelTempSensorHelp, "Fuel Temperature Sensor"
		text = "Configures the fuel temperature sensor input. Fuel temperature is used to correct injector flow rate for fuel density changes with temperature."
		text = "Select the ADC channel, set the pullup resistor, and enter three calibration reference points from the sensor datasheet."

	help = ambientTempSensorHelp, "Ambient Temperature Sensor"
		text = "Configures the ambient air temperature sensor. Place this sensor upstream of any turbocharger or supercharger near the air filter to measure true ambient conditions."
		text = "Select the ADC channel, set the pullup resistor, and enter three calibration reference points from the sensor datasheet."

	help = auxLinearSensorHelp, "Aux Linear Sensor"
		text = "Aux Linear Sensors are general-purpose analog inputs that convert a voltage signal into a scaled value using a two-point linear calibration."
		text = "Select the ADC input channel, then enter the low and high voltage reference points and the corresponding output values from the sensor datasheet. The ECU interpolates linearly between these two points."

	help = egoSettingsHelp, "CAN Wideband"
		text = "Configures wideband lambda sensors connected via CAN bus. Enable CAN Wideband to activate and select the CAN bus if the ECU has more than one."
		text = "Each sensor channel shows its type and connection ID. For Evotech WBO modules, set the hardware ID assigned to the module. For AEM modules, set the AEM CAN ID. The status indicators show communication health, AFR validity, and heater state for each channel."

	help = analogEgoHelp, "Analog Lambda"
		text = "Configures an analog wideband or narrowband lambda sensor connected directly to an ECU ADC input. Select a preset from Common Sensors to automatically fill the calibration points, or enter custom low and high voltage reference points and the corresponding AFR or lambda values."
		text = "Sensor 1 I/O sets the analog input channel and, for narrowband sensors, the heater output pin. Sensor 2 allows a second analog input for dual-channel setups. The Smoothing factor controls signal filtering. Signal correction shifts the output by a fixed offset to compensate for sensor-to-sensor variation."
		text = "Note: disable CAN wideband before using analog lambda. The two modes cannot operate simultaneously."

	help = oilPressureSensorHelp, "Oil Pressure Sensor"
		text = "Configures the engine oil pressure sensor input. Select the ADC input channel and enter the low and high voltage calibration points with the corresponding pressure values from the sensor datasheet."
		text = "Oil pressure is used for monitoring and protection strategies. If pressure drops below a threshold, a warning or engine protection action can be triggered."

	help = fuelPressureSensorHelp, "Fuel Pressure Sensor"
		text = "Configures the fuel pressure sensor inputs. The low pressure sensor monitors the fuel rail or low-pressure side. The high pressure sensor monitors the direct injection high-pressure side and supports SENT protocol input as an alternative to an analog signal."
		text = "For each analog sensor, enter the low and high voltage calibration points with the corresponding pressure values from the sensor datasheet."

	help = acPressureSensorHelp, "A/C Pressure Sensor"
		text = "Configures the air conditioning refrigerant pressure sensor. Select the ADC input channel and enter the low and high voltage calibration points with the corresponding pressure values from the sensor datasheet."
		text = "The A/C pressure reading is used to enable or disable the compressor clutch based on pressure limits and protect the system from operating outside its safe range."

	help = vrThresholdHelp, "VR Sensor Threshold"
		text = "This is about Evotech VR Discrete decoder"
		webHelp = "https://motrolink.com"

	help = tpsTpsHelp, "Acceleration Enrichment"
		text = "More about Tps To Tps acceleration on the web"
		webHelp = "https://motrolink.com"

	help = baseHelp, "Vehicle Information"
		text = "Configure engine specs (cylinders, displacement, firing order, fuel strategy) and vehicle identification (make, engine code, name, VIN)."
		text = "After setting the base engine information, all sensors and actuators must be configured before the engine can run correctly. Work through the Fuel, Ignition, Idle and Advanced menus to complete the setup — each section covers a different part of the calibration and all of them are required for a proper tune."
		text = "For any questions, the calibration manual is available at motrolink.com. You can also reach the support team directly through the contact options on the website."
		webHelp = "https://motrolink.com"

	help = lambdaProtectionHelp, "Lambda Protection"
		text = "Lambda protection continuously compares the measured lambda to the target and checks whether the difference exceeds the value in the Maximum Lambda Deviation table at the current RPM and load. When the deviation is too high — indicating the mixture is leaner than expected — and all activation conditions are met, the ECU cuts fuel injection to protect the engine. Fuel is restored only when load, TPS and RPM all drop below the configured restore thresholds."
		text = "Activation is guarded by minimum load, TPS and RPM thresholds plus a startup delay, preventing false triggers during light throttle operation or transients. The Maximum Lambda Deviation table defines how much lambda error is tolerated at each operating point — smaller values make the protection more sensitive in that region. A good starting point is 0.10 to 0.15 lambda across the map, tightening only at high load and RPM where a lean condition is most critical."

