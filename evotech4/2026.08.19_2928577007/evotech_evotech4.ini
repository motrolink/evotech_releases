	tpsAccelMinRate = "Minimum rate of throttle movement in percent per second required to trigger acceleration enrichment.\nIf set too low the enrichment fires on sensor noise or small throttle variations at steady speed causing unnecessary fuel spikes.\nIf set too high fast tip-ins go undetected and the engine may stumble under hard acceleration.\nTypical starting point is 10 to 40 percent per second. Raise it if false enrichment occurs at cruise. Lower it if stumble persists on quick throttle openings."
