	fuelAlgorithm = "Determines the method used for calculating fuel delivery. The following options are available:\nUses intake manifold pressure (MAP) and intake air temperature (IAT) to calculate air density and fuel requirements. This is a common strategy, especially for naturally aspirated or turbocharged engines.\nAlpha-N: Uses throttle position as the primary load input for fuel calculation. This strategy is generally used in engines with individual throttle bodies or those that lack a reliable MAP signal.\nMAF Air Charge: Relies on a Mass Air Flow (MAF) sensor to measure the amount of air entering the engine directly, making it effective for engines equipped with a MAF sensor.\nLua: Allows for custom fuel calculations using Lua scripting, enabling highly specific tuning applications where the other strategies don't apply."
	crankingInjectionMode = "This is the injection strategy during engine start. See Fuel/Injection settings for more detail. It is suggested to use "Simultaneous"."
	injectionMode = "This is where the fuel injection type is defined: "Simultaneous" means all injectors will fire together at once. "Sequential" fires the injectors on a per cylinder basis, which requires individually wired injectors. "Batched" will fire the injectors in groups."
	boostControlMinRpm = "RPM mínimo para habilitar o controle de pressão (boost). Evita ruído da solenóide na marcha lenta e melhora o spool."
	boostControlMinTps = "TPS mínimo para habilitar o controle de pressão (boost). Evita ruído da solenóide na marcha lenta e ajuda o turbo a entrar em carga."
	boostControlMinMap = "MAP mínimo para habilitar o controle de pressão. Evita oscilação da solenóide em marcha lenta."
