	globalTriggerAngleOffset = "Ângulo entre o Ponto Morto Superior (PMS) e o primeiro evento do sensor de sincronismo. Valores positivos indicam sincronização antes do PMS; valores negativos, após o PMS. Esse ângulo é essencial para o cálculo do avanço de ignição e outros ângulos de referência. COMO CALIBRAR: 1) Ative o modo de avanço fixo em 'Configurações de ignição'; 2) Use uma pistola estroboscópica; 3) Ajuste o valor até que o avanço fixo desejado seja confirmado pela pistola."
