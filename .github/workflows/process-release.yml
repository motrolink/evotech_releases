name: Process Releases

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - 'manifest.json'
      - '**.md'

permissions:
  contents: write

jobs:
  process-releases:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Process releases
        run: |
          echo "::group::Running release processor"
          python process_release.py
          echo "::endgroup::"

      - name: Check for changes
        id: check_changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected:"
            git status --short
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes to commit"
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git add .

          # Extrai informações dos diretórios modificados para mensagem de commit
          CHANGES=$(git diff --cached --name-only | grep -E '^[^/]+/[^/]+/' | head -5 | xargs)

          if [ -n "$CHANGES" ]; then
            git commit -m "ci: Atualiza manifest.json automaticamente" \
                       -m "Releases processados automaticamente pelo CI" \
                       -m "Arquivos: $CHANGES"
          else
            git commit -m "ci: Atualiza manifest.json automaticamente"
          fi

          git push

      - name: Summary
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          echo "### ✅ Releases processados com sucesso" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "O manifest.json foi atualizado e os releases foram reorganizados." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Arquivos modificados:**" >> $GITHUB_STEP_SUMMARY
          git diff --cached --name-only | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY

      - name: No changes summary
        if: steps.check_changes.outputs.has_changes == 'false'
        run: |
          echo "### ℹ️ Nenhuma mudança detectada" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Não foram encontrados novos releases para processar." >> $GITHUB_STEP_SUMMARY
